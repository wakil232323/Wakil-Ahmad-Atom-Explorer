name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q *.zip -d project

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project
        run: |
          find project -name settings.gradle -o -name build.gradle -o -name app

      - name: Build APK with Gradle
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name settings.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
