name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q *.zip -d project

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix JVM target
        run: |
          APP_GRADLE=$(find project -type f -path "*/app/build.gradle" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "Using: $APP_GRADLE"

          cat >> "$APP_GRADLE" <<'EOF'

          // CI JVM target fix
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name settings.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"

      - name: Build APK with Gradle
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
